name: Deploy Economic History Game

on:
  push:
    branches: [main]
    paths:
      - 'economic-history-game/**'
      - '.github/workflows/deploy-economic-history-game.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: economic-history-game-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload game site
        uses: actions/upload-pages-artifact@v3
        with:
          path: economic-history-game
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
